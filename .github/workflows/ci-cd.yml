name: CI/CD Pipeline

on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    name: Check, Test & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Bun Runtime
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Dependencies
        run: bun install

      - name: Type Check TypeScript
        run: bun run check

      - name: Run Unit Test Suite (70+ Tests)
        run: bun test

      - name: Build Production VS Code & Browser Bundles
        run: bun run build && bun run package:browser

      - name: Package VSIX Release
        run: npx @vscode/vsce package --no-dependencies

      - name: Upload Release Artifacts (VSIX & Browser ZIP)
        uses: actions/upload-artifact@v4
        with:
          name: fidel-releases
          path: |
            *.vsix
            fidel-browser-extension.zip
          retention-days: 14

  publish_ovsx:
    name: Publish to Open VSX (Cursor / VSCodium)
    needs: test
    if: (startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch') && secrets.OVSX_PAT != ''
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Bun Runtime
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Dependencies
        run: bun install

      - name: Build Production Bundle
        run: bun run build

      - name: Publish to Open VSX
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: npx ovsx publish -p "$OVSX_PAT"
