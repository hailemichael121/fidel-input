[build]
  command = "npm run build:browser && cd dist/browser && zip -r ../site/fidel-browser-extension.zip ."
  publish = "dist/site"

[build.environment]
  NODE_VERSION = "20"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
